<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Cascader</title>
  <style>
    :root { color-scheme: light dark; }
    body { max-width: 860px; margin: 2rem auto; padding: 0 1rem; font: 15px/1.5 system-ui, sans-serif; }
    h1 { font-size: 1.4rem; margin-bottom: .25rem; }
    #meta { color: #888; margin-top: 0; font-size: .85rem; }
    section { border: 1px solid #8884; border-radius: 8px; padding: .8rem 1rem; margin: 1rem 0; }
    label { display: inline-block; margin-right: 1rem; font-size: .9rem; }
    select { max-width: 320px; }
    button { padding: .45rem .9rem; cursor: pointer; margin-right: .5rem; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .col h3 { margin: 0 0 .4rem; font-size: .85rem; text-transform: uppercase; color: #888; }
    .lines { min-height: 120px; max-height: 260px; overflow-y: auto; border: 1px solid #8883; border-radius: 6px; padding: .4rem .6rem; font-size: .95rem; }
    .lines p { margin: .25rem 0; }
    .spoken { color: #888; }
    .converted { color: #3d9970; font-weight: 600; }
    .err { color: #e05252; }
    #stats { font-size: .8rem; color: #888; }
    pre { background: #8882; padding: .6rem; border-radius: 6px; overflow: auto; max-height: 240px; }
  </style>
</head>
<body>
  <h1>Audio Cascader</h1>
  <p id="meta">Checking status…</p>

  <section>
    <label>Microphone <select id="input"></select></label>
    <label>Output <select id="output"></select></label>
    <label>STT (applies at Start) <select id="stt">
      <option value="turbo" selected>turbo (best)</option>
      <option value="tiny">tiny (fast fallback)</option>
    </select></label>
    <p>
      <button id="start" type="button">Start live</button>
      <button id="stop" type="button">Stop</button>
    </p>
    <p id="stats">backlog 0.0s · drops 0 · recorded —</p>
  </section>

  <section>
    <div class="cols">
      <div class="col"><h3>Spoken (final STT)</h3><div class="lines" id="spoken"></div></div>
      <div class="col"><h3>Converted (sent to TTS)</h3><div class="lines" id="converted"></div></div>
    </div>
  </section>

  <section>
    <h3>File mode</h3>
    <form id="form">
      <input id="audio" type="file" accept="audio/*" required>
      <button>Convert</button>
    </form>
    <pre id="result"></pre>
  </section>

  <script>
    const meta = document.querySelector('#meta');
    const stats = document.querySelector('#stats');
    const spoken = document.querySelector('#spoken');
    const converted = document.querySelector('#converted');
    const result = document.querySelector('#result');

    function refreshStatus() {
      fetch('/api/status').then(r => r.json()).then(s => {
        const gpu = s.gpu || 'CUDA unavailable';
        meta.textContent = `${gpu} · STT ${s.stt_model} · TTS ${s.tts_model} · ${s.state}`;
        const rec = s.recording ? s.recording.wav.split(/[\\/]/).pop() : '—';
        stats.textContent = `backlog ${Number(s.playback_backlog_s).toFixed(1)}s · drops ${s.queue_drops}/${s.playback_drops} · recorded ${rec}`;
      });
    }
    refreshStatus();
    setInterval(refreshStatus, 2000);

    fetch('/api/devices').then(r => r.json()).then(devices => {
      const input = document.querySelector('#input');
      const output = document.querySelector('#output');
      let cableOption = null;
      devices.forEach(device => {
        const label = `${device.index}: ${device.name} [${device.host_api}]`;
        if (device.inputs) input.add(new Option(label, device.index));
        if (device.outputs) {
          const option = new Option(label, device.index);
          output.add(option);
          if (device.name.includes('CABLE Input') && (!cableOption || device.host_api === 'Windows WASAPI')) {
            cableOption = option;
          }
        }
      });
      if (cableOption) output.value = cableOption.value;
    });

    document.querySelector('#start').addEventListener('click', async () => {
      const input = document.querySelector('#input').value;
      const output = document.querySelector('#output').value;
      const stt = document.querySelector('#stt').value;
      spoken.innerHTML = ''; converted.innerHTML = '';
      const response = await fetch(`/api/start?input_device=${input}&output_device=${output}&stt_model=${stt}`, { method: 'POST' });
      const body = await response.json();
      if (!response.ok) append(spoken, 'error: ' + body.detail, 'err');
      refreshStatus();
    });

    document.querySelector('#stop').addEventListener('click', async () => {
      const response = await fetch('/api/stop', { method: 'POST' });
      const body = await response.json();
      result.textContent = JSON.stringify(body, null, 2);
      refreshStatus();
    });

    function append(container, text, cls) {
      const line = document.createElement('p');
      line.textContent = text;
      if (cls) line.className = cls;
      container.appendChild(line);
      container.scrollTop = container.scrollHeight;
    }

    const events = new EventSource('/api/events');
    events.onmessage = event => {
      const data = JSON.parse(event.data);
      if (data.kind === 'spoken') append(spoken, data.text, 'spoken');
      else if (data.kind === 'converted') append(converted, data.text, 'converted');
      else if (data.kind === 'error') append(spoken, 'error: ' + data.error, 'err');
      else if (data.kind === 'state') refreshStatus();
    };

    document.querySelector('#form').addEventListener('submit', async event => {
      event.preventDefault();
      const data = new FormData();
      data.append('upload', document.querySelector('#audio').files[0]);
      result.textContent = 'Processing…';
      const response = await fetch('/api/process', { method: 'POST', body: data });
      result.textContent = JSON.stringify(await response.json(), null, 2);
    });
  </script>
</body>
</html>
